<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08140F" />
    <title>EUREKA – AI study tutor, revision planner and exam practice</title>
    <meta name="description" content="EUREKA is an AI study tutor for GCSE, A-Level, IB and AP students. Ask about your own notes, practise exam questions with examiner-style marking, and get a revision timetable built around your exams." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EUREKA" />
    <meta property="og:title" content="EUREKA – Your studies, organised." />
    <meta property="og:description" content="AI tutor for your own notes, exam questions marked like an examiner, and a revision timetable built around your exams." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body style="background: #08140f">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Opened by double-clicking this file? Browsers can't run the source code that way,
      // which would leave a blank page — explain what to do instead.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (location.protocol !== 'file:' || !root || root.childNodes.length) return;
        root.innerHTML =
          '<div style="max-width:560px;margin:12vh auto;padding:32px;border:1px solid #1f4a37;border-radius:18px;background:#102a20;color:#f1f4ef;font:15px/1.6 system-ui,sans-serif">' +
          '<h1 style="margin:0 0 12px;font-size:22px">This file can’t be opened directly</h1>' +
          '<p style="margin:0 0 12px;color:#a0b3a6">This <code>index.html</code> is the starting point for EUREKA’s source code. A browser can only show the site when it is served by the development server or deployed.</p>' +
          '<p style="margin:0 0 6px"><b>To run it on your computer:</b> open a terminal in this folder and run</p>' +
          '<pre style="margin:0 0 12px;padding:12px;border-radius:10px;background:#08140f;color:#39a875">npm install\nnpm run dev</pre>' +
          '<p style="margin:0 0 12px">then open <b>http://localhost:5173</b> in your browser.</p>' +
          '<p style="margin:0;color:#a0b3a6">Just want to look around? Open <b>eureka-standalone.html</b> instead — it opens with a double-click (the AI tutor needs the server, though).</p>' +
          '</div>';
      }, 1500);
    </script>
  </body>
</html>
